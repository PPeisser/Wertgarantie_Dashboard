<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF4F8">
<title>WG Dashboard – keine Verbindung</title>
<style>
  html,body{height:100%;margin:0}
  body{
    background:#EEF4F8;color:#10202C;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
    box-sizing:border-box;
  }
  .card{background:#fff;border-radius:20px;border-top:6px solid #009FE3;box-shadow:0 2px 10px rgba(6,42,63,.08);padding:28px 26px;max-width:380px}
  img{width:72px;height:72px;margin-bottom:8px}
  h1{font-size:19px;color:#062A3F;margin:0 0 8px}
  p{font-size:14px;color:#5D7284;margin:0 0 20px;line-height:1.45}
  button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:12px 22px;background:#009FE3;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="">
    <h1>Keine Internetverbindung</h1>
    <p>Das Dashboard braucht eine Verbindung, um die aktuellen Daten zu laden. Bitte WLAN oder mobile Daten prüfen.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </div>
  <script>window.addEventListener("online",()=>location.reload());</script>
</body>
</html>
