<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abmeldung – Wertgarantie</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#EEF3F7;color:#10202C;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 12px 28px -10px rgba(6,42,63,.14);
        padding:36px 32px;max-width:440px;text-align:center}
  .badge{display:inline-flex;align-items:center;background:#10202C;border-radius:10px;padding:8px 14px;
         color:#fff;font-weight:800;font-size:15px;margin-bottom:20px}
  h1{font-size:19px;margin:0 0 10px;color:#062A3F}
  p{color:#5D7284;font-size:14.5px;line-height:1.6;margin:0}
  .termin{background:#F0FAFF;border:1px solid #009FE3;border-radius:12px;padding:14px 16px;margin:18px 0;
          text-align:left;font-size:14px;color:#062A3F;font-weight:600}
  .btn{display:inline-block;border:none;border-radius:10px;padding:12px 22px;font-size:14.5px;font-weight:700;
       font-family:inherit;cursor:pointer;margin-top:20px}
  .btn-danger{background:#E0234E;color:#fff}
  .btn-danger:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Wertgarantie</div>
    <h1 id="title">Einen Moment…</h1>
    <p id="message"></p>
    <div id="termin" class="termin" hidden></div>
    <div id="actions"></div>
  </div>

<script>
const SUPABASE_URL = "https://jtgoytbcqkqopdpjlozq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ic_T8F0q2Ogc1-8jaf3SIg_UTKtLXqe";
const FN_URL = SUPABASE_URL + "/functions/v1/cancel-registration";

const id = new URLSearchParams(location.search).get("id") || "";
const titleEl = document.getElementById("title");
const messageEl = document.getElementById("message");
const terminEl = document.getElementById("termin");
const actionsEl = document.getElementById("actions");

const MESSAGES = {
  not_found: ["Anmeldung nicht gefunden", "Diese Anmeldung wurde nicht gefunden – möglicherweise hast du dich bereits abgemeldet."],
  no_event_date: ["Termin nicht gefunden", "Zu dieser Anmeldung wurde kein Termin mehr gefunden. Bitte wende dich an die Person, von der du die Einladung erhalten hast."],
  expired: ["Abmeldung nicht mehr möglich", "Eine Online-Abmeldung ist ab 48 Stunden vor der Veranstaltung leider nicht mehr möglich. Bitte wende dich direkt an die Person, von der du die Einladung erhalten hast."],
  error: ["Etwas ist schiefgelaufen", "Bitte versuch es später noch einmal oder wende dich an die Person, von der du die Einladung erhalten hast."],
  cancelled: ["Du wurdest abgemeldet", "Deine Anmeldung wurde storniert. Schade, dass es diesmal nicht klappt – vielleicht bei einer der nächsten Veranstaltungen!"],
};

function showMessage(status) {
  const [title, message] = MESSAGES[status] || MESSAGES.error;
  titleEl.textContent = title;
  messageEl.textContent = message;
  terminEl.hidden = true;
  actionsEl.innerHTML = "";
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function fmtDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("de-AT", {
    weekday: "long", day: "2-digit", month: "2-digit", year: "numeric",
  });
}

async function callApi(method) {
  const res = await fetch(FN_URL + "?id=" + encodeURIComponent(id), {
    method,
    headers: { "Authorization": "Bearer " + SUPABASE_ANON_KEY, "apikey": SUPABASE_ANON_KEY },
  });
  return res.json();
}

async function init() {
  if (!id) return showMessage("not_found");
  let data;
  try {
    data = await callApi("GET");
  } catch (e) {
    return showMessage("error");
  }
  if (data.status !== "confirm") return showMessage(data.status);

  titleEl.textContent = "Wirklich abmelden?";
  messageEl.textContent = "Möchtest du deine Anmeldung zu dieser Veranstaltung stornieren?";
  terminEl.hidden = false;
  terminEl.innerHTML = (data.event?.title ? escapeHtml(data.event.title) + "<br>" : "")
    + escapeHtml(fmtDate(data.eventDate.event_date))
    + (data.eventDate.location ? " · " + escapeHtml(data.eventDate.location) : "");

  const btn = document.createElement("button");
  btn.className = "btn btn-danger";
  btn.textContent = "Ja, endgültig abmelden";
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "Wird abgemeldet…";
    try {
      const result = await callApi("POST");
      showMessage(result.status);
    } catch (e) {
      showMessage("error");
    }
  });
  actionsEl.innerHTML = "";
  actionsEl.appendChild(btn);
}

init();
</script>
</body>
</html>
